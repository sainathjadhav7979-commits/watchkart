<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WatchKart — Complete Watch Store</title>
<style>:root{--gold:#c9a24b;--gold2:#e2c071;--ink:#0d0d0d;--char:#2b2b2e;--bg:#faf8f4}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--char)}
h1,h2,h3,h4,.brand{font-family:'Playfair Display',serif}
.gold{color:var(--gold)}
.btn-gold{background:var(--gold);color:#111;border:0;font-weight:500;transition:.25s}
.btn-gold:hover{background:var(--ink);color:var(--gold);transform:translateY(-2px)}
.btn-outline-gold{border:1px solid var(--gold);color:var(--gold)}
.btn-outline-gold:hover{background:var(--gold);color:#111}
.wk-nav{background:var(--ink);box-shadow:0 2px 12px #0006}
.wk-nav .navbar-brand{font-size:1.6rem;font-weight:700;color:#fff}
.wk-nav .nav-link{color:#ddd}
.wk-nav .nav-link:hover,.wk-nav .nav-link.active{color:var(--gold)}
.nav-ico{color:#fff;position:relative;font-size:1.1rem;padding:.4rem .6rem;background:none;border:0;text-decoration:none}
.nav-ico:hover{color:var(--gold)}
.nav-ico .badge{position:absolute;top:-2px;right:-2px;background:var(--gold)!important;color:#111;font-size:.6rem}
.hero{background:radial-gradient(circle at 80% 40%,#3a3320,#0d0d0d 60%);color:#fff;padding:90px 0;overflow:hidden}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05}
.hero img{max-width:100%;max-height:460px;object-fit:contain;background:#fff;padding:18px;border-radius:28px;box-shadow:0 0 90px #c9a24b55;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.sec-title{text-align:center;margin-bottom:2.5rem}
.sec-title h2{font-weight:700}
.sec-title:after{content:"";display:block;width:60px;height:3px;background:var(--gold);margin:12px auto 0}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 10px;background:#fff;border-radius:16px;color:var(--char);text-decoration:none;box-shadow:0 4px 18px #0001;transition:.3s;text-align:center}
.cat-tile i{font-size:2rem;color:var(--gold);transition:.3s}
.cat-tile:hover{background:var(--ink);color:#fff;transform:translateY(-6px)}
.cat-tile:hover i{transform:scale(1.2) rotate(-8deg)}
.wk-card{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #0001;transition:.3s}
.wk-card:hover{transform:translateY(-6px);box-shadow:0 14px 34px #0003}
.wk-card img{transition:.4s}.wk-card:hover img{transform:scale(1.06)}
.wk-card .im{overflow:hidden;display:block}
.heart{position:absolute;top:10px;right:10px;z-index:2;border:0;background:#fff;width:36px;height:36px;border-radius:50%;box-shadow:0 2px 8px #0003}
.heart.on i{color:#d33}
.wk-card h6{font-weight:600;margin:2px 0}
.pimg{aspect-ratio:1;object-fit:contain;background:#fff;transform:scale(var(--s,1))}
.pimg-sm{object-fit:contain;background:#fff;aspect-ratio:1;height:auto}
.zoom{overflow:hidden;border-radius:16px;cursor:zoom-in;background:#fff}
.zoom img{transition:transform .25s}.zoom:hover img{transform:scale(2)}
.thumb{width:80px;height:80px;object-fit:contain;background:#fff;border-radius:10px;cursor:pointer;border:2px solid transparent}
.thumb.on{border-color:var(--gold)}
.box{background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001;padding:1.5rem}
.stat{font-size:2.4rem;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif}
.auth-wrap{max-width:900px;margin:auto;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 20px 50px #0003}
.auth-img{min-height:300px;background:#fff center/contain no-repeat}
.side a{display:block;padding:.7rem 1rem;border-radius:10px;color:var(--char);text-decoration:none}
.side a:hover,.side a.on{background:var(--ink);color:var(--gold)}
footer{background:var(--ink);color:#bbb}footer a{color:#bbb;text-decoration:none;display:block;margin:.3rem 0}footer a:hover{color:var(--gold)}
.page-head{background:var(--ink);color:#fff;padding:36px 0}
.qty{display:inline-flex;align-items:center;border:1px solid #ccc;border-radius:30px;overflow:hidden}
.qty button{border:0;background:none;width:34px;height:34px}.qty span{min-width:32px;text-align:center}
.map-ph{height:240px;border-radius:16px;background:repeating-linear-gradient(45deg,#e8e4da,#e8e4da 12px,#f2efe7 12px,#f2efe7 24px);display:grid;place-items:center;color:#888}
.adm{display:flex;min-height:100vh}
.adm-side{width:230px;background:var(--ink);padding:20px 12px;flex-shrink:0}
.adm-side a{display:block;color:#bbb;padding:.6rem .9rem;border-radius:8px;text-decoration:none}
.adm-side a:hover,.adm-side a.on{background:#222;color:var(--gold)}
.adm-main{flex:1;padding:24px;min-width:0}
.kpi{border-left:4px solid var(--gold)}

@media(max-width:991px){.hero{padding:50px 0;text-align:center}.hero img{max-width:70%;margin-top:30px}.adm{flex-direction:column}.adm-side{width:100%;display:flex;flex-wrap:wrap;gap:4px}}
@media(max-width:575px){.hero .btn{width:100%;margin-bottom:8px}.stat{font-size:1.8rem}.zoom:hover img{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

'admin-orders'(){shell('Order Management',tbl(['Order ID','Customer','Date','Amount','Payment','Status','Actions'],ORDERS.map(o=>`<tr><td>${o.id}</td><td>${o.cust}</td><td>${o.date}</td><td>${inr(o.amt)}</td><td>${o.pay}</td><td><span class="badge bg-${BADGE[o.st]}">${o.st}</span></td><td><select class="form-select form-select-sm st" style="width:140px">${STATUS.map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')));
 document.addEventListener('change',e=>{if(!e.target.classList.contains('st'))return;const b=e.target.closest('tr').querySelector('.badge');b.className='badge bg-'+BADGE[e.target.value];b.textContent=e.target.value;toast('Status changed to '+e.target.value,'success')})},
'admin-users'(){const u=['Rahul Sharma','Priya Patil','Amit Verma','Sneha Rao','Karan Mehta'];shell('Users & Customers',tbl(['ID','Name','Email','Orders','Action'],u.map((n,i)=>`<tr><td>${i+1}</td><td>${n}</td><td>${n.split(' ')[0].toLowerCase()}@example.com</td><td>${i+2}</td><td><button class="btn btn-sm btn-outline-danger" onclick="delRow(this)"><i class="fa fa-trash"></i> Remove</button></td></tr>`).join('')))},
'admin-categories'(){shell('Categories',tbl(['Category','Watches','Action'],CATS.map(c=>`<tr><td><i class="fa ${c[1]} gold me-2"></i>${c[2]}</td><td>${PRODUCTS.filter(p=>p.cats.includes(c[0])).length}</td><td><button class="btn btn-sm btn-outline-danger" onclick="delRow(this)"><i class="fa fa-trash"></i> Delete</button></td></tr>`).join('')))}});

</script>
<script>
function routeName(){let raw=location.hash.replace(/^#\/?/,'');let p=raw.split('?')[0]||'home';return p==='index'?'home':(p==='product-details'?'details':p);}
function navigate(page,query=''){location.hash='#/'+page+(query?(query[0]==='?'?query:'?'+query):'');}
function renderRoute(){let page=routeName();if(!PAGE_TEMPLATES[page])page='home';document.body.dataset.page=page;document.title=page==='home'?'Home | WatchKart':page.replace(/-/g,' ').replace(/\b\w/g,x=>x.toUpperCase())+' | WatchKart';
 const tpl=PAGE_TEMPLATES[page]||PAGE_TEMPLATES.home;document.getElementById('page').innerHTML=tpl;
 // Keep page markup inside the persistent page container; all original selectors are document-wide.
 if(window.initWatchKart)window.initWatchKart();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',renderRoute);
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(!a)return;const href=a.getAttribute('href');if(href==='#/'||href==='#/home')return;});
// Ensure pages can route from both hand-authored templates and generated UI links.
renderRoute();
</script></body></html>
